databases:
  - name: letus-db
    plan: free
    databaseName: letustv
    user: letus

services:
  - type: web
    name: letus-tv
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: letus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@letustv.com
      - key: ADMIN_PASSWORD
        value: AdminLetus2026!
      - key: NEXT_PUBLIC_SITE_URL
        value: https://letus-tv.onrender.com
